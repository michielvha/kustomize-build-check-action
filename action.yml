name: 'Kustomize Build Check'
description: 'Automatically discover and validate Kustomize overlays and bases with smart change detection'
author: 'michielvha'

branding:
  icon: 'anchor'
  color: 'blue'

inputs:
  base-ref:
    description: 'Base git reference to compare against (default: auto-detect from PR or HEAD~1)'
    required: false
    default: ''
  
  enable-helm:
    description: 'Enable Helm chart inflation in Kustomize builds'
    required: false
    default: 'true'
  
  fail-on-error:
    description: 'Fail the workflow if any Kustomize build fails'
    required: false
    default: 'true'
  
  root-dir:
    description: 'Root directory to search for Kustomize files'
    required: false
    default: '.'

  on-unresolvable-base:
    description: 'What to do when base-ref cannot be resolved locally (e.g. a shallow clone): validate-all (default) validates every discovered kustomization; fail stops the run'
    required: false
    default: 'validate-all'

  build-timeout:
    description: 'Maximum time for a single kustomize build, as a Go duration (e.g. 90s, 5m). Per build, not per run. A malformed, zero or negative value fails the run rather than silently reverting to the default'
    required: false
    default: '2m'

outputs:
  results:
    description: 'JSON output of all build results'
  
  failed-count:
    description: 'Number of failed builds'
  
  success-count:
    description: 'Number of successful builds'

  skipped-count:
    description: 'Number of paths skipped because they no longer exist (deleted or renamed by the change)'

  change-detection-mode:
    description: 'How the validated set was determined: diff (normal) or full-scan (base-ref unresolvable, so everything was validated)'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/michielvha/kustomize-build-check:b6f2c239f6c01135fbcc1073ff18bacd9d9c8497'
